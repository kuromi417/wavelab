<!DOCTYPE html>

<body>
    <h1 class="page-title">기업소개</h1>
    <div class="category-description">
        <p class="main-desc">창의적인 체험 교육의 리더, 웨이브랩이 아이들의 꿈과 함께합니다.</p>
        <p class="sub-desc">웨이브랩은 단순한 교육을 넘어 감동과 경험을 전달하는 체험학습 전문 기업입니다.<br>교육 현장의 목소리에 귀 기울여 최상의 커리큘럼을 제공할 것을 약속드립니다.</p>
    </div>
    <section class="content-grid">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=400&h=300" alt="비전">
            <div class="card-overlay-basic">핵심 가치 및 비전</div>
            <div class="card-overlay-hover"><h3>Vision</h3><p>미래 세대를 위한 혁신적 교육 서비스</p></div>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=400&h=300" alt="연혁">
            <div class="card-overlay-basic">웨이브랩 발자취</div>
            <div class="card-overlay-hover"><h3>History</h3><p>매년 500개교 이상의 학교와 함께 성장해왔습니다.</p></div>
        </div>
    </section>
